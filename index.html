        function setupScrollDots(scrollElId, dotsElId) {
            const scroller = $(scrollElId);
            const dotsContainer = $(dotsElId);
            if (!scroller || !dotsContainer) return;

            function updateDots() {
                const items = [...scroller.children];
                if (!items.length) { dotsContainer.innerHTML = ''; return; }
                const total = items.length;
                const scrollLeft = scroller.scrollLeft;
                const maxScroll = scroller.scrollWidth - scroller.clientWidth;
                let activeIdx = 0;
                if (maxScroll > 1) {
                    const ratio = scrollLeft / maxScroll;
                    activeIdx = Math.min(total - 1, Math.max(0, Math.round(ratio * (total - 1))));
                }

                if (dotsContainer.children.length !== total) {
                    dotsContainer.innerHTML = items.map((_, i) => 
                        `<button onclick="scrollToItem('${scrollElId}', ${i})" aria-label="Slide ${i+1}" class="h-1.5 rounded-full transition-all duration-300 ${i === activeIdx ? 'w-6 bg-leaf-800' : 'w-1.5 bg-stone-300 hover:bg-stone-400'}"></button>`
                    ).join('');
                } else {
                    [...dotsContainer.children].forEach((dot, i) => {
                        const isActive = i === activeIdx;
                        dot.className = `h-1.5 rounded-full transition-all duration-300 ${isActive ? 'w-6 bg-leaf-800' : 'w-1.5 bg-stone-300 hover:bg-stone-400'}`;
                    });
                }
            }

            if (!scroller._hasDotsListener) {
                scroller.addEventListener('scroll', () => {
                    if (scroller._scrollTimer) cancelAnimationFrame(scroller._scrollTimer);
                    scroller._scrollTimer = requestAnimationFrame(updateDots);
                }, { passive: true });
                scroller._hasDotsListener = true;
            }
            updateDots();
        }

        function scrollToItem(scrollElId, index) {
            const scroller = $(scrollElId);
            if (!scroller) return;
            const items = [...scroller.children];
            if (items[index]) {
                items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }
